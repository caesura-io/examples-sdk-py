name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC — catches published SDK drift

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [fastapi-openai-server]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync
        working-directory: examples/${{ matrix.example }}

      - name: Lint (ruff)
        run: uv run ruff check .
        working-directory: examples/${{ matrix.example }}

      - name: Type check (mypy)
        run: uv run mypy .
        working-directory: examples/${{ matrix.example }}

      - name: Test (pytest)
        run: uv run pytest
        working-directory: examples/${{ matrix.example }}
